name: Validate PR Title

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      # Shared types and core scopes (data, docs, ci, deps, deps-dev, infra) live in
      # Deliverome-Project/.github/actions/pr-title; list only this repo's own scopes here.
      - name: Validate PR title shape
        uses: Deliverome-Project/.github/actions/pr-title@main
        with:
          extra-scopes: |
            surface-proteome
            sources
            merge
            audit
            agents
            tools
            viewer
            paper
