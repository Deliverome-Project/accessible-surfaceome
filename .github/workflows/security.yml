name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "37 8 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  security:
    uses: Deliverome-Project/.github/.github/workflows/security.yml@v1
