name: viewer build check

# Mirror the Cloudflare Pages build locally: anything that breaks the
# Pages deploy should fail this workflow first. Runs on every PR (so
# `viewer-build` can be a required check) but only does the work when
# `viewer/**` or this file changed; otherwise the job is skipped, which
# GitHub counts as passing. Also runs on pushes to `main` that touch the
# viewer, so a broken viewer commit never reaches the Pages production branch.
on:
  pull_request:
  push:
    branches:
      - main
    paths:
      - "viewer/**"
      - ".github/workflows/viewer-build.yml"

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      viewer: ${{ steps.diff.outputs.viewer }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if git diff --name-only "$BASE"...HEAD | grep -qE '^(viewer/|\.github/workflows/viewer-build\.yml$)'; then
            echo "viewer=true" >> "$GITHUB_OUTPUT"
          else
            echo "viewer=false" >> "$GITHUB_OUTPUT"
            echo "No viewer changes; skipping the build."
          fi

  viewer-build:
    needs: changes
    if: needs.changes.outputs.viewer == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: viewer
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: "viewer/.nvmrc"
          cache: "npm"
          cache-dependency-path: viewer/package-lock.json

      - name: install
        run: npm ci

      - name: audit
        # Fails on high or critical advisories. `next` is on the stable 16.3.x line
        # (16.3.0 shipped the fixes the old 16.3.0-canary pin was waiting for).
        run: npm audit --audit-level=high

      - name: typecheck
        run: npm run check

      - name: render tests
        # Runs viewer/tests/*.test.tsx via react-dom/server (no jsdom) — the
        # component-render assertions (sortable-column counts, chip-jump ids,
        # rationale rendering) that neither tsc nor `next build` exercise.
        # These were NOT gated in CI before, which let an ExpressionTable
        # sortable-column regression (a7c2163e7) merge silently. Now gated.
        run: bash tests/run_render_tests.sh

      - name: build-fetch pacing/retry tests
        # scripts/lib/build-fetch.mjs (the shared limiter + retry/degraded/
        # backoff machinery every bulk per-gene build fetcher routes
        # through) plus the two build-*.mjs scripts' own translation logic
        # — see PR #275 (the 2026-09-28 incident fix). Includes one real
        # ~15-20s integration test of the I1 early-abort circuit breaker
        # against a local mock HTTP server (never the production API).
        run: bash tests/run_build_fetch_tests.sh

      - name: SSG degraded-record fallback tests
        # viewer/lib/surfaceome.ts's live-fetch fallback (_fetchRecordFromWorker,
        # used by `next dev` and any build that skipped the record snapshot)
        # gets the same degraded/retry/Retry-After hardening as the build
        # scripts above — pinned here since it's a separate code path.
        run: bash tests/run_surfaceome_record_degraded_tests.sh

      - name: build (offline stub mode)
        # GitHub-Actions IPs get a Cloudflare WAF 403 against
        # `api.deliverome.org/surfaceome/v1/catalog`, so CI runs the
        # build with `SURFACEOME_API_BASE=local` — the loader
        # short-circuits to an empty stub catalog. The Pages-side
        # production build hits the live Worker and emits the
        # populated page. This step is an offline build smoke that
        # catches syntax / type / SSG regressions before Pages tries.
        env:
          SURFACEOME_API_BASE: local
        run: npm run build
