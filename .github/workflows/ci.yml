name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.14"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
      - name: Install dependencies
        run: uv sync --frozen
      - name: Validate lockfile
        run: uv lock --check
      - name: Check shared API compatibility with dev
        # The main Worker also serves the dev viewer. These routes must remain
        # available even while the corresponding UI exists only on dev.
        env:
          REQUIRE_WORKER_NODE: "1"
        run: uv run --frozen pytest -q tests/test_worker_internalization.py
      - name: Run Python checks
        # Wire the public-D1 read creds so tests/test_d1_records_schema_drift.py
        # can enumerate every published record and validate it against the
        # current SurfaceomeRecord Pydantic schema. Without these the test
        # skips and stale-shape records (the OLDREC / FAKE3 / FAKE1 class)
        # silently land on main, crash the Pages SSG, and freeze prod.
        # Fork PRs don't get the secrets — the test skips there too, which
        # is fine: the org-internal PR merge is the gate that matters.
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_D1_SURFACEOME_PUBLIC_ID: ${{ secrets.CLOUDFLARE_D1_SURFACEOME_PUBLIC_ID }}
        run: bash scripts/check-py.sh
      - name: Run pre-commit hooks
        run: uv run --frozen pre-commit run --all-files --config .pre-commit-config.yaml
