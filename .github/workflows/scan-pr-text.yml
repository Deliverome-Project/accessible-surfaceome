name: Scan PR text for workspace identifiers

# The pre-commit hook covers committed files, but the leak this exists to prevent was in a
# PR *comment* -- text that never passes through git. On 2026-09-28 a comment carried a
# Modal console URL embedding the workspace slug on this public repo. Nothing in the
# commit path could have caught it, so it is checked here instead.
#
# Bare run identifiers (ap-XXXX) are fine and are the recommended way to cite a run; it is
# the console URL around them that carries the workspace.

on:
  pull_request:
    types: [opened, edited, reopened]
  issue_comment:
    types: [created, edited]

permissions:
  contents: read
  pull-requests: read
  issues: read

jobs:
  scan:
    runs-on: ubuntu-latest
    # issue_comment fires on plain issues too; only PR threads matter here.
    if: github.event_name == 'pull_request' || github.event.issue.pull_request
    steps:
      - uses: actions/checkout@v4
      - name: Scan the PR body and comments
        env:
          BODY: ${{ github.event.pull_request.body || github.event.comment.body }}
        run: |
          printf '%s' "$BODY" > /tmp/pr_text.md
          python3 scripts/precommit/forbid_workspace_urls.py /tmp/pr_text.md
